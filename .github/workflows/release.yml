name: Release

# Publishes a GitHub release whenever the newest version in CHANGELOG.md has no tag yet.
# To release: add a "## [x.y.z] - YYYY-MM-DD" section at the top of CHANGELOG.md and merge to main.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read newest version from CHANGELOG.md
        id: version
        run: |
          version=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          if [ -z "$version" ]; then echo "::error::No '## [x.y.z]' heading found in CHANGELOG.md"; exit 1; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Notes = everything between the newest heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          echo "Newest version: v$version"

      - name: Create tag and release if new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest
