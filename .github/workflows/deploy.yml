name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate static site
        run: dotnet run --project src/Portfolio.Site -c Release -- --out dist

      - name: Print CV page to PDF
        run: |
          python3 -m http.server 8080 --directory dist >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8080/cv/ >/dev/null && break; sleep 0.5; done
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --no-pdf-header-footer --virtual-time-budget=10000 \
            --print-to-pdf=dist/Prajwal-Giri-CV.pdf http://localhost:8080/cv/
          test -s dist/Prajwal-Giri-CV.pdf
          echo "CV PDF: $(stat -c%s dist/Prajwal-Giri-CV.pdf) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
